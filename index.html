<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una domanda speciale</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
    background: #1a0810;
  }

  .bg {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a0810 0%, #3b0f1e 25%, #1a0810 50%, #2e0c18 75%, #1a0810 100%);
    background-size: 400% 400%;
    animation: bgShift 12s ease infinite;
    z-index: 0;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .hearts-bg {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
  }

  .floating-heart {
    position: absolute;
    font-size: 1.4rem;
    opacity: 0;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
    10% { opacity: 0.45; }
    90% { opacity: 0.45; }
    100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
  }

  .snow-container {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
  }

  .snowflake {
    position: absolute;
    color: rgba(255,255,255,0.8);
    font-size: 1rem;
    opacity: 0;
    animation: snowFall linear infinite;
  }

  @keyframes snowFall {
    0% { transform: translateY(-5vh) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.4; }
    100% { transform: translateY(105vh) translateX(40px) rotate(360deg); opacity: 0; }
  }

  .card {
    position: relative; z-index: 10;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 32px;
    padding: 3.5rem 3rem;
    max-width: 520px;
    width: 90%;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    animation: cardIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(40px) scale(0.95);
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .emoji-top {
    font-size: 2.6rem;
    margin-bottom: 0.8rem;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .question {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 20px rgba(140, 30, 50, 0.4);
  }

  .subtitle {
    font-size: 0.95rem;
    color: rgba(255, 255, 255, 0.35);
    margin-bottom: 2.5rem;
    font-style: italic;
    font-family: 'Playfair Display', serif;
  }

  .buttons {
    display: flex;
    gap: 1.2rem;
    justify-content: center;
    align-items: center;
    min-height: 70px;
  }

  .btn-yes {
    background: linear-gradient(135deg, #8b1a2b, #a3273b);
    color: white;
    border: none;
    padding: 16px 44px;
    font-size: 1.2rem;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 30px rgba(139, 26, 43, 0.5);
    letter-spacing: 0.5px;
  }

  .btn-yes:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 40px rgba(139, 26, 43, 0.7);
    background: linear-gradient(135deg, #a3273b, #c0354a);
  }

  .btn-no {
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 14px 36px;
    font-size: 1rem;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    white-space: nowrap;
  }

  .yes-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    animation: revealIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes revealIn {
    from { opacity: 0; transform: scale(0.8) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .celebration-emoji {
    font-size: 3.2rem;
    margin-bottom: 0.8rem;
    animation: bounce 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes bounce {
    0% { transform: scale(0); }
    60% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  .yes-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .yes-subtitle {
    font-size: 1.05rem;
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 2rem;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    max-width: 380px;
    line-height: 1.5;
  }

  .bouquet {
    position: relative;
    width: 200px;
    height: 180px;
    margin: 0 auto 2rem;
    animation: bouquetIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
  }

  @keyframes bouquetIn {
    from { opacity: 0; transform: scale(0) rotate(-10deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .bouquet .flower {
    position: absolute;
    font-size: 2.8rem;
    animation: bloomIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes bloomIn {
    from { transform: scale(0) rotate(-30deg); opacity: 0; }
    to { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .bouquet .f1 { top: 0; left: 50%; transform: translateX(-50%); animation-delay: 0.4s; }
  .bouquet .f2 { top: 15px; left: 15%; animation-delay: 0.55s; }
  .bouquet .f3 { top: 15px; right: 15%; animation-delay: 0.65s; }
  .bouquet .f4 { top: 50px; left: 5%; animation-delay: 0.75s; }
  .bouquet .f5 { top: 50px; right: 5%; animation-delay: 0.85s; }
  .bouquet .f6 { top: 45px; left: 38%; animation-delay: 0.7s; }
  .bouquet .f7 { top: 80px; left: 25%; animation-delay: 0.9s; }
  .bouquet .f8 { top: 80px; right: 25%; animation-delay: 0.95s; }
  .bouquet .wrap { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); font-size: 4rem; animation-delay: 1s; }

  .ticket {
    background: linear-gradient(135deg, #dfe6e9, #ffffff);
    border-radius: 16px;
    padding: 0;
    max-width: 380px;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    animation: ticketIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both;
    border: 2px dashed rgba(0,0,0,0.1);
  }

  @keyframes ticketIn {
    from { opacity: 0; transform: translateY(30px) rotateX(10deg); }
    to { opacity: 1; transform: translateY(0) rotateX(0deg); }
  }

  .ticket-header {
    background: linear-gradient(135deg, #0984e3, #74b9ff);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .ticket-header-left { text-align: left; }

  .ticket-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.7);
    font-weight: 700;
  }

  .ticket-resort {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
  }

  .ticket-mountain-emoji { font-size: 2.2rem; }

  .ticket-body {
    padding: 20px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    text-align: left;
  }

  .ticket-field label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #888;
    font-weight: 700;
    display: block;
    margin-bottom: 2px;
  }

  .ticket-field span {
    font-size: 0.95rem;
    color: #2d3436;
    font-weight: 600;
  }

  .ticket-footer {
    border-top: 2px dashed rgba(0,0,0,0.08);
    padding: 12px 24px;
    text-align: center;
    font-size: 0.85rem;
    color: #636e72;
    font-style: italic;
  }

  .confetti-container {
    position: fixed; inset: 0; z-index: 100; pointer-events: none;
    display: none;
  }

  @media (max-width: 480px) {
    .card { padding: 2.5rem 1.5rem; }
    .question { font-size: 1.8rem; }
    .yes-title { font-size: 1.8rem; }
    .ticket-resort { font-size: 1.1rem; }
    .btn-yes { padding: 14px 32px; font-size: 1.1rem; }
    .btn-no { padding: 12px 28px; font-size: 0.95rem; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="hearts-bg" id="heartsBg"></div>
<div class="snow-container" id="snowContainer"></div>

<div class="card" id="card">
  <div id="questionScreen">
    <div class="emoji-top">💝</div>
    <h1 class="question">Vuoi essere la mia Valentina?</h1>
    <p class="subtitle">— scegli con saggezza —</p>
    <div class="buttons" id="buttonsRow">
      <button class="btn-yes" id="btnYes">Si</button>
      <button class="btn-no" id="btnNo">No</button>
    </div>
  </div>

  <div class="yes-screen" id="yesScreen">
    <div class="celebration-emoji">🥰</div>
    <h2 class="yes-title">Tooooooppp!!</h2>
    <p class="yes-subtitle">È proprio bello sciare con lei, Trentani Francesca</p>

    <div class="bouquet">
      <span class="flower f1">🌹</span>
      <span class="flower f2">🌷</span>
      <span class="flower f3">🌸</span>
      <span class="flower f4">🌻</span>
      <span class="flower f5">🌺</span>
      <span class="flower f6">💐</span>
      <span class="flower f7">🪻</span>
      <span class="flower f8">🌼</span>
      <span class="flower wrap">🎀</span>
    </div>

    <div class="ticket">
      <div class="ticket-header">
        <div class="ticket-header-left">
          <div class="ticket-label">Skipass</div>
          <div class="ticket-resort">Monte Cimone</div>
        </div>
        <div class="ticket-mountain-emoji">🏔️</div>
      </div>
      <div class="ticket-body">
        <div class="ticket-field">
          <label>Quando</label>
          <span>Questo weekend</span>
        </div>
        <div class="ticket-field">
          <label>Passeggeri</label>
          <span>Io e te</span>
        </div>
        <div class="ticket-field">
          <label>Attività</label>
          <span>Sciare e mangiare</span>
        </div>
        <div class="ticket-field">
          <label>Stato d'animo</label>
          <span>Combattivi</span>
        </div>
      </div>
      <div class="ticket-footer">
        Copriti bene, alla cioccolata calda ci penso io
      </div>
    </div>
  </div>
</div>

<div class="confetti-container" id="confettiContainer"></div>

<script>
  // Floating elements
  const heartsBg = document.getElementById('heartsBg');
  const heartEmojis = ['💗', '🌸', '✨'];
  for (let i = 0; i < 12; i++) {
    const span = document.createElement('span');
    span.className = 'floating-heart';
    span.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    span.style.left = Math.random() * 100 + '%';
    span.style.animationDuration = (7 + Math.random() * 9) + 's';
    span.style.animationDelay = (Math.random() * 12) + 's';
    span.style.fontSize = (0.7 + Math.random() * 1) + 'rem';
    heartsBg.appendChild(span);
  }

  const snowContainer = document.getElementById('snowContainer');
  const snowChars = ['❄', '❅', '❆', '·'];
  for (let i = 0; i < 30; i++) {
    const span = document.createElement('span');
    span.className = 'snowflake';
    span.textContent = snowChars[Math.floor(Math.random() * snowChars.length)];
    span.style.left = Math.random() * 100 + '%';
    span.style.animationDuration = (5 + Math.random() * 10) + 's';
    span.style.animationDelay = (Math.random() * 12) + 's';
    span.style.fontSize = (0.4 + Math.random() * 0.8) + 'rem';
    snowContainer.appendChild(span);
  }

  // NO button — always visible, bounces around, never disappears
  const btnNo = document.getElementById('btnNo');
  const btnYes = document.getElementById('btnYes');
  let noAttempts = 0;
  let escaped = false;
  const funTexts = [
    'No',
    'Col cavolo!',
    'Manco morta!',
    'Neanche per sogno',
    'Ma figurati',
    'Sei sicura?!',
    'Arrivo!',
    'Non mi prendi!',
    'Troppo lenta!',
    'Dai schiaccia Si!',
    'Mi arrendo... no!',
    'Scappo!',
    'Provaci ancora',
    'Niente da fare!',
    'Ahahah!',
    'Col cavolo!',
  ];

  function moveNoButton() {
    noAttempts++;

    // First hover: pull out of normal flow
    if (!escaped) {
      const rect = btnNo.getBoundingClientRect();
      btnNo.style.position = 'fixed';
      btnNo.style.left = rect.left + 'px';
      btnNo.style.top = rect.top + 'px';
      btnNo.style.margin = '0';
      btnNo.style.zIndex = '50';
      escaped = true;
    }

    // Safe zone: 5% to 75% of viewport width, 5% to 85% of viewport height
    // This guarantees the button + its text never clips outside
    var safeLeft = window.innerWidth * 0.05;
    var safeRight = window.innerWidth * 0.75;
    var safeTop = window.innerHeight * 0.05;
    var safeBottom = window.innerHeight * 0.85;
    var newX = safeLeft + Math.random() * (safeRight - safeLeft);
    var newY = safeTop + Math.random() * (safeBottom - safeTop);

    btnNo.style.left = newX + 'px';
    btnNo.style.top = newY + 'px';

    // Cycle through fun texts
    const idx = noAttempts % funTexts.length;
    btnNo.textContent = funTexts[idx];

    // Yes button grows slightly
    const scale = 1 + noAttempts * 0.04;
    btnYes.style.transform = 'scale(' + Math.min(scale, 1.35) + ')';
  }

  btnNo.addEventListener('mouseenter', moveNoButton);
  btnNo.addEventListener('touchstart', function(e) { e.preventDefault(); moveNoButton(); });

  // YES — the No button stays visible but stops running
  btnYes.addEventListener('click', function() {
    document.getElementById('questionScreen').style.display = 'none';
    // Hide the escaped No button
    if (escaped) btnNo.style.display = 'none';
    document.getElementById('yesScreen').style.display = 'flex';
    launchConfetti();
  });

  // Confetti
  function launchConfetti() {
    const container = document.getElementById('confettiContainer');
    container.style.display = 'block';
    const colors = ['#8b1a2b', '#a3273b', '#c0354a', '#74b9ff', '#fdcb6e', '#ff6b6b', '#d4a574', '#55efc4'];

    for (let i = 0; i < 80; i++) {
      const piece = document.createElement('div');
      piece.style.position = 'absolute';
      piece.style.top = '50%';
      piece.style.left = '50%';
      piece.style.width = (6 + Math.random() * 8) + 'px';
      piece.style.height = (6 + Math.random() * 8) + 'px';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

      const angle = Math.random() * Math.PI * 2;
      const velocity = 200 + Math.random() * 500;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity - 200;
      const rot = Math.random() * 720 - 360;

      piece.animate([
        { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + tx + 'px, ' + ty + 'px) rotate(' + rot + 'deg)', opacity: 0 }
      ], {
        duration: 1200 + Math.random() * 800,
        easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
        fill: 'forwards',
        delay: Math.random() * 200
      });

      container.appendChild(piece);
    }

    setTimeout(function() { container.innerHTML = ''; container.style.display = 'none'; }, 3000);
  }
</script>

</body>
</html>
